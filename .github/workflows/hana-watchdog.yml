name: HANA Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check /health endpoint
        id: health
        run: |
          HTTP_CODE=$(curl -s -o /tmp/health_body.json -w "%{http_code}" \
            --max-time 15 \
            https://sap-threat-detector.cfapps.us10-001.hana.ondemand.com/health || echo "000")

          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

          if [ "$HTTP_CODE" = "000" ]; then
            echo "App did not respond (timeout or connection refused)"
            echo "needs_wake=true" >> $GITHUB_OUTPUT
          else
            echo "HTTP $HTTP_CODE — response body:"
            cat /tmp/health_body.json
            MOCK_HANA=$(cat /tmp/health_body.json | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(str(d.get('mock_hana','false')).lower())" \
              2>/dev/null || echo "unknown")
            echo "mock_hana=$MOCK_HANA" >> $GITHUB_OUTPUT
            if [ "$MOCK_HANA" = "true" ]; then
              echo "mock_hana=true → HANA is down"
              echo "needs_wake=true" >> $GITHUB_OUTPUT
            else
              echo "HANA is connected and healthy"
              echo "needs_wake=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Install CF CLI
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          curl -sL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8" | tar -zx
          sudo mv cf8 /usr/local/bin/cf

      - name: Login to SAP BTP Cloud Foundry
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          cf login \
            -a ${{ secrets.CF_API_ENDPOINT }} \
            -u ${{ secrets.CF_USERNAME }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ secrets.CF_SPACE }}

      - name: Set up Python
        if: steps.health.outputs.needs_wake == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hdbcli for wake_hana.py
        if: steps.health.outputs.needs_wake == 'true'
        run: pip install hdbcli python-dotenv

      - name: Wake HANA (start if stopped)
        if: steps.health.outputs.needs_wake == 'true'
        env:
          HANA_HOST: ${{ secrets.HANA_HOST }}
          HANA_PORT: ${{ secrets.HANA_PORT }}
          HANA_USER: ${{ secrets.HANA_USER }}
          HANA_PASSWORD: ${{ secrets.HANA_PASSWORD }}
        run: python scripts/wake_hana.py

      - name: Wait 5 minutes for HANA to stabilize
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          echo "Waiting 5 minutes before restarting the app..."
          sleep 300

      - name: Restart CF app
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          echo "Restarting sap-threat-detector..."
          cf restart sap-threat-detector

      - name: Verify app is healthy after restart
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          echo "Waiting 30s for app to boot..."
          sleep 30
          HTTP_CODE=$(curl -s -o /tmp/health_after.json -w "%{http_code}" \
            --max-time 15 \
            https://sap-threat-detector.cfapps.us10-001.hana.ondemand.com/health || echo "000")
          echo "Post-restart HTTP: $HTTP_CODE"
          cat /tmp/health_after.json || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo "App still unhealthy after restart (HTTP $HTTP_CODE)"
            cf logs sap-threat-detector --recent
            exit 1
          fi
          MOCK_HANA=$(cat /tmp/health_after.json | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(str(d.get('mock_hana','?')).lower())" \
            2>/dev/null || echo "?")
          echo "mock_hana after restart: $MOCK_HANA"
          if [ "$MOCK_HANA" = "true" ]; then
            echo "WARNING: App restarted but HANA still in mock mode"
            cf logs sap-threat-detector --recent
            exit 1
          fi
          echo "App is healthy and connected to real HANA."
