name: HANA Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check /ready endpoint
        id: health
        run: |
          # /ready actually probes HANA via pool.ping(); /health only reports
          # whether HANA_HOST env var is set, which is useless as a liveness
          # signal in prod where the env is always populated.
          HTTP_CODE=$(curl -s -o /tmp/ready_body.json -w "%{http_code}" \
            --max-time 15 \
            https://sap-threat-detector.cfapps.us10-001.hana.ondemand.com/ready || echo "000")

          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

          if [ "$HTTP_CODE" = "000" ]; then
            echo "App did not respond (timeout or connection refused)"
            echo "needs_wake=true" >> $GITHUB_OUTPUT
          else
            echo "HTTP $HTTP_CODE — response body:"
            cat /tmp/ready_body.json
            echo ""
            HANA_OK=$(python3 -c "
          import json
          try:
              with open('/tmp/ready_body.json') as f:
                  d = json.load(f)
              hana = next((c for c in d.get('checks', []) if c.get('name') == 'hana'), None)
              print('true' if hana and hana.get('ok') else 'false')
          except Exception:
              print('false')
          ")
            echo "hana_ok=$HANA_OK" >> $GITHUB_OUTPUT
            if [ "$HANA_OK" != "true" ]; then
              echo "HANA is not reachable per /ready → will wake"
              echo "needs_wake=true" >> $GITHUB_OUTPUT
            else
              echo "HANA is connected and healthy"
              echo "needs_wake=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Install CF CLI
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          curl -sL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8" | tar -zx
          sudo mv cf8 /usr/local/bin/cf

      - name: Login to SAP BTP Cloud Foundry
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          cf login \
            -a ${{ secrets.CF_API_ENDPOINT }} \
            -u ${{ secrets.CF_USERNAME }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ secrets.CF_SPACE }}

      - name: Set up Python
        if: steps.health.outputs.needs_wake == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hdbcli for wake_hana.py
        if: steps.health.outputs.needs_wake == 'true'
        run: pip install hdbcli python-dotenv

      - name: Wake HANA (start if stopped)
        if: steps.health.outputs.needs_wake == 'true'
        env:
          HANA_HOST: ${{ secrets.HANA_HOST }}
          HANA_PORT: ${{ secrets.HANA_PORT }}
          HANA_USER: ${{ secrets.HANA_USER }}
          HANA_PASSWORD: ${{ secrets.HANA_PASSWORD }}
        run: python scripts/wake_hana.py

      - name: Wait 5 minutes for HANA to stabilize
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          echo "Waiting 5 minutes before restarting the app..."
          sleep 300

      - name: Restart CF app
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          echo "Restarting sap-threat-detector..."
          cf restart sap-threat-detector

      - name: Verify app is healthy after restart
        if: steps.health.outputs.needs_wake == 'true'
        run: |
          echo "Waiting 30s for app to boot..."
          sleep 30
          HTTP_CODE=$(curl -s -o /tmp/ready_after.json -w "%{http_code}" \
            --max-time 15 \
            https://sap-threat-detector.cfapps.us10-001.hana.ondemand.com/ready || echo "000")
          echo "Post-restart HTTP: $HTTP_CODE"
          cat /tmp/ready_after.json || true
          echo ""
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "503" ]; then
            echo "App did not respond after restart (HTTP $HTTP_CODE)"
            cf logs sap-threat-detector --recent
            exit 1
          fi
          HANA_OK=$(python3 -c "
          import json
          try:
              with open('/tmp/ready_after.json') as f:
                  d = json.load(f)
              hana = next((c for c in d.get('checks', []) if c.get('name') == 'hana'), None)
              print('true' if hana and hana.get('ok') else 'false')
          except Exception:
              print('false')
          ")
          echo "hana_ok after restart: $HANA_OK"
          if [ "$HANA_OK" != "true" ]; then
            echo "App restarted but HANA is still unreachable per /ready"
            cf logs sap-threat-detector --recent
            exit 1
          fi
          echo "App is healthy and connected to real HANA."
