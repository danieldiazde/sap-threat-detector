# SAP BTP Cloud Foundry Deployment Manifest
# Deploy with: cf push -f infra/manifest.yml
# Docs: https://docs.cloudfoundry.org/devguide/deploy-apps/manifest-attributes.html

applications:
  - name: sap-threat-detector
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      POLL_INTERVAL_SECONDS: 30
    # Secrets are set via GitHub Actions (cf set-env) — never put them here
